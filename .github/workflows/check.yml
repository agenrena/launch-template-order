name: Check Order
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
    outputs:
      commit:
        value: ${{ jobs.check.outputs.commit }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: order_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SECRET_KEY: ci-only-secret-not-used-outside-disposable-tests
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/order_ci
      COOKIE_SECURE: 'false'
      AGENRENA_VENDOR_ID: ''
      AGENRENA_VENDOR_SECRET: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mcp/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r scripts/requirements-publish.txt
      - run: python -m unittest discover -s scripts -p 'test_publish_template.py' -v
      - run: python backend/manage.py test core.tests ordering.tests --noinput
      - name: Backend tests on SQLite (the local default)
        run: python backend/manage.py test core.tests ordering.tests --noinput
        env:
          DATABASE_URL: ''
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci --prefix mcp
      - run: npm test --prefix mcp
      - if: inputs.release_tag != ''
        run: |
          docker build -f backend/Dockerfile -t order-backend-check .
          docker build -f frontend/Dockerfile -t order-frontend-check .
          docker build -f mcp/Dockerfile -t order-mcp-check .
      - if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_template.py pack --version "$RELEASE_TAG" --repository "$SOURCE_REPOSITORY"
      - if: inputs.release_tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: order-template
          path: release-dist/
          if-no-files-found: error
          retention-days: 7
